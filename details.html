<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - SHE MADE</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .color-circle.selected {
      border: 3px solid var(--secondary-color) !important;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Layout Placeholders -->
  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1060; margin-top: 70px;">
    <div id="cartToast" class="toast align-items-center text-white bg-custom border-0 rounded-pill shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex px-3 py-2">
        <div class="toast-body fw-bold fs-6">
          <i class="fas fa-check-circle me-2"></i> Added to cart successfully!
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content d-flex flex-column" style="min-height: calc(100vh - 70px);">
    
    <div class="container-fluid px-0 flex-grow-1">
      <!-- Amazon-style stacked layout: exact same spacing as homepage banner -->
      <div class="bg-white rounded-4 shadow-sm p-4">
        
        <!-- Product Image Carousel (Swipable) -->
        <div class="col-12 mb-4">
          <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators" id="carousel-dots"></div>
            <div class="carousel-inner rounded-4 shadow-sm border" id="carousel-images"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true" style="opacity: 0.5;"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true" style="opacity: 0.5;"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>

        <!-- Product Info -->
        <div class="col-12 d-flex flex-column">
          <h2 id="detail-name" class="fw-bold text-custom mb-2">Loading...</h2>
          
          <p id="detail-description" class="text-secondary mb-3 small lh-lg">
            This beautiful handmade piece is crafted with love and care to add a unique touch to your style. Perfect for everyday wear or special occasions.
          </p>
          
          <h3 id="detail-price" class="fw-bold text-dark mb-4 border-bottom pb-3">0 EGP</h3>
          
          <!-- Colors Selection -->
          <div id="detail-colors-container" class="mb-4 d-none">
            <h6 class="fw-bold mb-2">Available Colors:</h6>
            <div id="detail-colors" class="d-flex gap-2"></div>
            <small id="color-error" class="text-danger d-none mt-1">Please select a color</small>
          </div>

          <!-- Quantity Selector -->
          <div class="mb-4 d-flex align-items-center">
            <h6 class="fw-bold mb-0 me-3">Quantity:</h6>
            <div class="input-group" style="width: 130px;">
              <button class="btn btn-outline-secondary text-custom" type="button" id="btn-minus"><i class="fas fa-minus"></i></button>
              <input type="text" class="form-control text-center fw-bold" value="1" id="input-qty" readonly>
              <button class="btn btn-outline-secondary text-custom" type="button" id="btn-plus"><i class="fas fa-plus"></i></button>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="mt-2">
            <button class="btn btn-custom rounded-pill px-4 py-3 fw-bold text-white bg-custom w-100 shadow-sm" id="add-to-cart-btn">
              <i class="fas fa-shopping-cart me-2"></i> Add to Cart
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Item Reviews Section (Similar to Best Sellers) -->
    <div class="container-fluid px-0 mt-5 mb-5 d-none" id="product-reviews-section">
      <div class="d-flex justify-content-between align-items-center mb-3 px-4">
        <h4 class="fw-bold section-title mb-0">Customer Reviews</h4>
        <a href="#" id="see-all-reviews-link" class="text-custom text-decoration-none small fw-bold">See All <i class="fas fa-arrow-right ms-1"></i></a>
      </div>
      <div class="horizontal-scroll-container pb-3 px-4" id="product-reviews-container">
        <!-- JS will inject reviews here -->
      </div>
    </div>

  </div>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
  
  <!-- Details Page Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('id'));
      const product = products.find(p => p.id === productId);

      let selectedColorBg = null; // To store the selected color gradient/string

      if (product) {
        document.title = product.name + " - SHE MADE";
        document.getElementById('detail-name').innerText = product.name;
        document.getElementById('detail-price').innerText = product.price + ' EGP';
        
        // Carousel setup
        const dotsContainer = document.getElementById('carousel-dots');
        const imagesContainer = document.getElementById('carousel-images');
        
        if(product.images && product.images.length > 0) {
          product.images.forEach((imgSrc, index) => {
            const activeClass = index === 0 ? 'active' : '';
            dotsContainer.innerHTML += `<button type="button" data-bs-target="#productCarousel" data-bs-slide-to="${index}" class="${activeClass}" aria-label="Slide ${index+1}"></button>`;
            imagesContainer.innerHTML += `
              <div class="carousel-item ${activeClass}">
                <img src="${imgSrc}" class="d-block w-100 rounded" alt="${product.name}" style="height: 550px; object-fit: contain; background-color: #f8f9fa;">
              </div>
            `;
          });
        } else {
          let imgSrc = (product.image && product.image !== "") ? product.image : 'images/featured-placeholder.png';
          imagesContainer.innerHTML = `
            <div class="carousel-item active">
              <img src="${imgSrc}" class="d-block w-100 rounded" alt="${product.name}" style="height: 550px; object-fit: contain; background-color: #f8f9fa;">
            </div>
          `;
        }

        // Color Setup
        if (product.colors && product.colors.length > 0) {
          document.getElementById('detail-colors-container').classList.remove('d-none');
          const colorsContainer = document.getElementById('detail-colors');
          
          product.colors.forEach((colorGroup, index) => {
            let bgStyle = getColorBackground(colorGroup);
            
            let circle = document.createElement('span');
            circle.className = 'color-circle shadow-sm';
            circle.style = `${bgStyle} width:35px; height:35px; border-radius:50%; display:inline-block; border:2px solid #ddd; cursor: pointer; transition: transform 0.2s;`;
            
            circle.onmouseover = () => { if (!circle.classList.contains('selected')) circle.style.transform = 'scale(1.1)'; };
            circle.onmouseout = () => { if (!circle.classList.contains('selected')) circle.style.transform = 'scale(1)'; };
            
            // Selection logic
            circle.onclick = () => {
              // Remove selected class from all
              document.querySelectorAll('.color-circle').forEach(c => {
                c.classList.remove('selected');
                c.style.transform = 'scale(1)';
              });
              // Add to clicked
              circle.classList.add('selected');
              circle.style.transform = 'scale(1.1)';
              selectedColorBg = bgStyle;
              document.getElementById('color-error').classList.add('d-none'); // Hide error
            };

            colorsContainer.appendChild(circle);
          });
        }

        // Global Reviews Setup (Cross-selling)
        const reviewsSection = document.getElementById('product-reviews-section');
        const reviewsContainer = document.getElementById('product-reviews-container');
        const seeAllLink = document.getElementById('see-all-reviews-link');
        
        reviewsSection.classList.remove('d-none');
        seeAllLink.href = 'reviews.html'; // Link to global reviews page
        
        const globalReviews = [
          { image: "images/featured-placeholder.png", text: "Amazing quality, highly recommend! The packaging was so cute too.", date: "2 days ago" },
          { image: "images/featured-placeholder.png", text: "Looks exactly like the picture, I'm in love with the crochet top.", date: "1 week ago" }
        ];

        let reviewsHtml = '';
        globalReviews.forEach(review => {
          reviewsHtml += `
            <div class="card border-0 shadow-sm rounded-4 flex-shrink-0" style="width: 280px;">
              <img src="${review.image}" class="card-img-top rounded-top-4" alt="Review Image" style="height: 200px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text mb-2 text-dark small fw-bold">"${review.text}"</p>
                <p class="text-muted small mb-0"><i class="fas fa-clock me-1"></i> ${review.date}</p>
              </div>
            </div>
          `;
        });
        reviewsContainer.innerHTML = reviewsHtml;
      }

      // Quantity Logic
      let qty = 1;
      const inputQty = document.getElementById('input-qty');
      document.getElementById('btn-plus').addEventListener('click', () => { qty++; inputQty.value = qty; });
      document.getElementById('btn-minus').addEventListener('click', () => { if(qty > 1) { qty--; inputQty.value = qty; }});

      // Add to Cart Logic
      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        if (!product) return;
        
        // Validation: Ensure color is selected if colors exist
        if (product.colors && product.colors.length > 0 && !selectedColorBg) {
          document.getElementById('color-error').classList.remove('d-none');
          return;
        }

        let firstImage = product.image;
        if(product.images && product.images.length > 0) firstImage = product.images[0];
        if(!firstImage) firstImage = 'images/featured-placeholder.png';

        const cartItem = {
          id: product.id,
          name: product.name,
          price: product.price,
          quantity: qty,
          image: firstImage,
          color: selectedColorBg // Will be null if product has no colors
        };

        addToCart(cartItem);

        // Show Bootstrap Toast
        const toastEl = document.getElementById('cartToast');
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
      });
    });
  </script>
</body>
</html>
