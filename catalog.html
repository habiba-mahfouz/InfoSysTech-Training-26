<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog - SHE MADE</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Layout Placeholders -->
  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content d-flex flex-column" style="min-height: calc(100vh - 70px);">
    
    <div class="container-fluid mt-5 w-100 px-md-5 flex-grow-1">
      <h2 id="catalog-title" class="fw-bold text-center mb-5 main-section-title">Products</h2>
      
      <!-- Catalog Grid -->
      <div id="catalog-grid" class="row row-cols-2 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-5 pb-5">
        <!-- JS injects cards here -->
      </div>
    </div>

  </div>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script> <!-- Included just in case nav badge needs it later -->
  <script src="js/layout.js"></script>
  
  <!-- Catalog Page Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const title = urlParams.get('title');
      
      if(title) {
        document.getElementById('catalog-title').innerText = title;
        document.title = title + " - SHE MADE";
      }
      
      // The rendering logic is handled by renderCatalog() in products.js
    });
  </script>
</body>
</html>
