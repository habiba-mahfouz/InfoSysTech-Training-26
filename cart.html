<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - SHE MADE</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Layout Placeholders -->
  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content d-flex flex-column align-items-center" style="min-height: calc(100vh - 70px);">
    
    <div class="container-fluid mt-5 w-100 px-md-5 d-flex flex-column flex-grow-1">

      <h2 class="fw-bold text-center mb-5 main-section-title">Your Cart</h2>
      
      <!-- Empty State -->
      <div id="empty-cart" class="text-center my-5 d-none">
        <img src="images/qr.png" alt="Empty Cart" class="mb-4 opacity-50" style="width: 150px;">
        <h4 class="text-muted mb-4">You haven't added anything yet!</h4>
        <a href="homepage.html" class="btn btn-custom rounded-pill px-5 py-2 fw-bold text-white bg-custom">Shop Now</a>
      </div>

      <!-- Filled State -->
      <div id="filled-cart" class="mx-auto w-100 d-none" style="max-width: 800px; flex-grow: 1;">
        
        <!-- Cart Items List (Populated by JS) -->
        <div class="cart-items-container" id="cart-items-container">
          <!-- JS injects items here -->
        </div>

        <!-- Total & Action -->
        <div class="mt-4 pt-4 border-top d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
          <div class="text-center text-md-start">
            <h4 class="fw-bold text-muted mb-0">Grand Total</h4>
            <h2 class="fw-bold text-custom mb-0" id="cart-grand-total">0 EGP</h2>
          </div>
          <div>
            <button id="whatsapp-btn" class="btn btn-success btn-lg rounded-pill px-5 shadow-sm d-flex align-items-center w-100 justify-content-center">
              <i class="fab fa-whatsapp fs-4 me-2"></i> Order via WhatsApp
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Scripts -->
  <script src="js/cart.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
