<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHE MADE - Homepage</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Hero Section -->
    <section class="hero rounded-4 shadow-sm text-center text-white d-flex align-items-center justify-content-center mb-5">
      <div class="hero-content p-4 rounded-4">
        <img src="images/logo.png" alt="Logo" width="80" class="rounded-circle mb-3 shadow">
        <h1 class="display-3 fw-bold mb-0">SHE MADE</h1>
        <p class=" lead fw-light fst-italic mt-2 mb-4"> Made for women by women </p>
      </div>
    </section>

    <!-- Best Sellers -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3 px-2">
        <h3 class="fw-bold section-title">Best Sellers</h3>
        <a href="catalog.html?type=tag&val=best-seller&title=Best+Sellers" class="text-custom text-decoration-none small fw-bold">View All  <i class="fas fa-chevron-right"></i></a>
      </div>
      <div class="horizontal-scroll-container pb-3 px-2 dynamic-products" data-filter-type="tag" data-filter-value="best-seller">
      </div>
    </section>

    <!-- New Arrivals -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3 px-2">
        <h3 class="fw-bold section-title">New Arrivals</h3>
        <a href="catalog.html?type=tag&val=new-arrival&title=New+Arrivals" class="text-custom text-decoration-none small fw-bold">View All  <i class="fas fa-chevron-right"></i></a>
      </div>
      <div class="horizontal-scroll-container pb-3 px-2 dynamic-products" data-filter-type="tag" data-filter-value="new-arrival">
      </div>
    </section>

    <!-- How to Order Video -->
    <section class="mb-5 py-5 bg-white rounded-4 shadow-sm text-center">
      <h2 class="fw-bold mb-3">How to Order?</h2>
      <p class="text-muted mb-4">Watch this short video to learn how to easily order via WhatsApp</p>
      <div class="video-container mx-auto" style="max-width: 600px; height: 350px; background-color: #f1f1f1; border-radius: 15px; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-play-circle text-custom" style="font-size: 4rem; cursor: pointer;"></i>
      </div>
    </section>

  </div>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Layout Script -->
  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
