<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crochet Collection | SHE MADE</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Navbar -->
  <div id="navbar-container"></div>

  <main class="container my-5">
    <div id="crochet-sections-container">
      <!-- Dynamic Subcategory Sections Injected Here -->
    </div>
  </main>

  <!-- Reusable Footer -->
  <div id="footer-container"></div>

  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const products = await App.fetchProducts({ parentCategory: 'Crochet' });
      const container = document.getElementById('crochet-sections-container');

      // Group products by categoryName
      const groups = {};
      products.forEach(p => {
        const cat = p.categoryName || 'General';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(p);
      });

      let html = '';
      Object.keys(groups).forEach(subCat => {
        html += `
          <section class="mb-5">
            <div class="section-header">
              <h2 class="section-title">Crochet / ${subCat}</h2>
              <a href="category.html?parent=Crochet&sub=${encodeURIComponent(subCat)}" class="show-all-link" data-i18n="show_all">SHOW ALL <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div class="row g-4">
              ${groups[subCat].map(p => createProductCardHtml(p)).join('')}
            </div>
          </section>
        `;
      });

      container.innerHTML = html;
    });
  </script>
</body>
</html>
