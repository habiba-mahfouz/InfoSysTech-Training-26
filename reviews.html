<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews - SHE MADE</title>

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Specific styles for Instagram-like Feed */
    .feed-container {
      max-width: 500px;
      margin: 0 auto;
    }
    .post-card {
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      background-color: #fff;
      margin-bottom: 25px;
    }
    .post-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #efefef;
    }
    .post-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--secondary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-right: 12px;
    }
    .post-image {
      width: 100%;
      height: 500px;
      object-fit: cover;
      background-color: #fafafa;
    }
    .post-footer {
      padding: 12px 16px;
    }
    .post-actions i {
      font-size: 1.5rem;
      margin-right: 15px;
      cursor: pointer;
      color: #262626;
      transition: color 0.2s;
    }
    .post-actions i:hover {
      color: var(--primary-color);
    }
    .post-likes {
      font-weight: 600;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .post-caption {
      font-size: 0.95rem;
    }
    .post-time {
      font-size: 0.75rem;
      color: #8e8e8e;
      margin-top: 5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <!-- Main Content -->
  <div class="main-content d-flex flex-column" style="min-height: calc(100vh - 70px);">

    <h2 class="fw-bold text-center mb-2 main-section-title">Customer Reviews</h2>
    <p class="text-center text-muted mb-5">See what our lovely customers are saying about us! 💖</p>
    
    <!-- Feed Container -->
    <div class="feed-container">
      
      <!-- Review 1 -->
      <div class="post-card p-3">
        <!-- Placeholder for a screenshot of a review -->
        <img src="images/featured-placeholder.png" alt="Review Image" class="post-image rounded">
        
        <div class="mt-3">
          <div class="post-caption text-dark">
            Just received this beautiful message from one of our amazing customers! Thank you so much for your trust. 🌸
          </div>
          <div class="post-time mt-2 text-muted fw-bold">2 DAYS AGO</div>
        </div>
      </div>

      <!-- Review 2 -->
      <div class="post-card p-3">
        <!-- Placeholder for a screenshot of a review -->
        <img src="images/featured-placeholder.png" alt="Review Image" class="post-image rounded">
        
        <div class="mt-3">
          <div class="post-caption text-dark">
            Look how gorgeous these beaded earrings look! We love seeing your photos. ✨
          </div>
          <div class="post-time mt-2 text-muted fw-bold">1 WEEK AGO</div>
        </div>
      </div>

    </div>

  </div>

  <div id="footer-placeholder"></div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Layout Script -->
  <script src="js/layout.js"></script>
</body>
</html>
