<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results | SHE MADE</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Navbar -->
  <div id="navbar-container"></div>

  <main class="container my-5">
    
    <!-- Empty Search State -->
    <div id="no-results-container" class="empty-card d-none">
      <div class="empty-icon-wrap bg-light text-muted">
        <i class="fa-regular fa-face-frown"></i>
      </div>
      <h2 class="empty-title">
        <span data-i18n="no_results_title">No Results Found for</span> "<span id="search-query-text"></span>"
      </h2>
      <p class="empty-text" data-i18n="no_results_sub">
        We couldn't find anything matching your search. Try exploring our curated suggestions below or refine your keywords.
      </p>
      <a href="index.html" class="btn btn-mauve" data-i18n="continue_shopping">CONTINUE SHOPPING</a>
    </div>

    <!-- Populated Search State -->
    <div id="results-container" class="d-none">
      <h1 class="text-center font-serif display-5 fw-bold mb-5" data-i18n="search_results">Search Results</h1>
      <div class="row g-4" id="search-results-grid">
        <!-- Matching Product Cards injected here -->
      </div>
    </div>

  </main>

  <!-- Reusable Footer -->
  <div id="footer-container"></div>

  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const query = urlParams.get('q') || '';

      const searchInput = document.getElementById('navbar-search');
      if (searchInput && query) searchInput.value = query;

      const products = await App.fetchProducts({ search: query });

      const noResults = document.getElementById('no-results-container');
      const results = document.getElementById('results-container');
      const queryText = document.getElementById('search-query-text');
      const grid = document.getElementById('search-results-grid');

      if (!products || products.length === 0) {
        noResults.classList.remove('d-none');
        results.classList.add('d-none');
        queryText.textContent = query;
      } else {
        noResults.classList.add('d-none');
        results.classList.remove('d-none');
        grid.innerHTML = products.map(p => createProductCardHtml(p)).join('');
      }
    });
  </script>
</body>
</html>
