<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | SHE MADE</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Reusable Navbar -->
  <div id="navbar-container"></div>

  <main class="container my-5">

    <!-- Section 1: Product Details -->
    <div class="row g-5 align-items-start mb-5" id="product-detail-container">

      <!-- Left Column: Main Image & Gallery Thumbnails -->
      <div class="col-12 col-md-6">
        <img id="detail-main-img" src="" alt="Product Image" class="detail-main-img mb-3">
        <div class="row g-2" id="detail-gallery-thumbs">
          <!-- Gallery thumbnails injected here -->
        </div>
      </div>

      <!-- Right Column: Product Information & Form -->
      <div class="col-12 col-md-6">
        <h1 id="detail-title" class="detail-title">Loading...</h1>
        <p id="detail-desc" class="detail-desc"></p>
        <div id="detail-price" class="detail-price">0.00 EGP</div>
        <!-- Form Fields -->
        <div class="mb-4">
          <label class="form-label-custom" data-i18n="color_pref">Color Preference <span
              class="text-danger">*</span></label>
          <input type="text" id="color-input" class="input-custom" placeholder="e.g., Ivory, Sage Green, Deep Rose"
            data-i18n-placeholder="color_pref_placeholder" required>
        </div>

        <div class="mb-4">
          <label class="form-label-custom" data-i18n="notes_label">Special Notes or Sizing (optional)</label>
          <textarea id="notes-input" class="input-custom" rows="3"
            placeholder="Add specific measurements or special instructions here..."
            data-i18n-placeholder="notes_placeholder"></textarea>
        </div>

        <!-- Quantity & Total Calculation -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <label class="form-label-custom me-2 d-inline" data-i18n="quantity">Quantity</label>
            <div class="qty-control ms-2">
              <button type="button" class="qty-btn" id="qty-minus">-</button>
              <input type="text" id="qty-input" class="qty-input" value="1" readonly>
              <button type="button" class="qty-btn" id="qty-plus">+</button>
            </div>
          </div>
          <div class="text-end">
            <span class="fs-5 font-serif fw-bold text-dark me-2" data-i18n="total">Total</span>
            <span id="calculated-total" class="fs-4 font-serif fw-bold text-mauve">0.00 EGP</span>
          </div>
        </div>

        <!-- Add to Cart Button -->
        <button type="button" id="add-to-cart-btn" class="btn btn-mauve w-100 py-3">
          <i class="fa-solid fa-cart-shopping me-2"></i><span data-i18n="add_to_cart">Add to Cart</span>
        </button>

      </div>

    </div>

    <!-- Section 2: Related Items -->
    <section class="my-5">
      <h2 class="section-title mb-4" data-i18n="related_items">Related Items</h2>
      <div class="row g-4" id="related-items-grid">
        <!-- 4 Related items injected here -->
      </div>
    </section>

  </main>

  <!-- Reusable Footer -->
  <div id="footer-container"></div>

  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || 1;

      const product = await App.fetchProductById(productId);
      if (!product) return;

      // Fill Details
      document.getElementById('detail-title').textContent = product.productName;
      document.getElementById('detail-desc').textContent = product.description;
      document.getElementById('detail-price').textContent = `${product.price.toFixed(2)} EGP`;
      const mainImg = document.getElementById('detail-main-img');
      mainImg.src = product.mainImage;

      // Gallery Thumbnails
      const galleryThumbs = document.getElementById('detail-gallery-thumbs');
      if (galleryThumbs && product.images && product.images.length > 0) {
        galleryThumbs.innerHTML = product.images.map((imgUrl, idx) => `
          <div class="col-3">
            <img src="${imgUrl}" class="thumb-img ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${imgUrl}', this)">
          </div>
        `).join('');
      }

      // Quantity & Price Dynamic Multiplier
      let quantity = 1;
      const qtyInput = document.getElementById('qty-input');
      const calcTotal = document.getElementById('calculated-total');

      function updatePriceDisplay() {
        qtyInput.value = quantity;
        const total = product.price * quantity;
        calcTotal.textContent = `${total.toFixed(2)} EGP`;
      }
      updatePriceDisplay();

      document.getElementById('qty-minus').addEventListener('click', () => {
        if (quantity > 1) {
          quantity--;
          updatePriceDisplay();
        }
      });

      document.getElementById('qty-plus').addEventListener('click', () => {
        quantity++;
        updatePriceDisplay();
      });

      // Add to Cart
      document.getElementById('add-to-cart-btn').addEventListener('click', () => {
        const color = document.getElementById('color-input').value;
        const notes = document.getElementById('notes-input').value;
        App.addToCart(product, color, notes, quantity);
      });

      // Load Related Items
      const related = await App.fetchRelatedProducts(productId);
      const relatedGrid = document.getElementById('related-items-grid');
      if (relatedGrid) {
        relatedGrid.innerHTML = related.map(p => createProductCardHtml(p)).join('');
      }
    });

    function changeMainImage(url, thumbEl) {
      document.getElementById('detail-main-img').src = url;
      document.querySelectorAll('.thumb-img').forEach(el => el.classList.remove('active'));
      thumbEl.classList.add('active');
    }
  </script>
</body>

</html>
