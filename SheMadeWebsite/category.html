<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Showcase | SHE MADE</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Reusable Navbar -->
  <div id="navbar-container"></div>

  <main class="container my-5">
    <h1 id="category-title" class="font-serif display-5 fw-bold mb-4">Category</h1>
    <div class="row g-4" id="category-grid">
      <!-- Products injected here -->
    </div>
  </main>

  <!-- Reusable Footer -->
  <div id="footer-container"></div>

  <script src="js/config.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const type = urlParams.get('type');
      const parent = urlParams.get('parent');
      const sub = urlParams.get('sub');

      const titleEl = document.getElementById('category-title');
      const grid = document.getElementById('category-grid');

      let filterParams = {};

      if (type === 'bestseller') {
        titleEl.textContent = 'Best Seller';
        filterParams.isBestSeller = true;
      } else if (type === 'newarrival') {
        titleEl.textContent = 'New Arrivals';
        filterParams.isNewArrival = true;
      } else if (sub) {
        titleEl.textContent = `${parent ? parent + ' / ' : ''}${sub}`;
        filterParams.parentCategory = parent;
        filterParams.categoryName = sub;
      } else if (parent) {
        titleEl.textContent = parent;
        filterParams.parentCategory = parent;
      }

      const products = await App.fetchProducts(filterParams);
      if (grid) {
        grid.innerHTML = products.map(p => createProductCardHtml(p)).join('');
      }
    });
  </script>
</body>
</html>
